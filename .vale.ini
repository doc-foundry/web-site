StylesPath = styles
MinAlertLevel = suggestion
Vocab = DocFoundry

Packages = Microsoft

# MDX needs Vale's mdx2vast parser; add [*.mdx] when the blog is turned on.
[*.md]
BasedOnStyles = Vale, Microsoft

# Blog profile, for blog posts and articles. Both are signed first-person articles, not product docs, so these Microsoft
# rules don't fit. Every other rule still applies; CI fails on warnings and errors only, so
# suggestions such as Passive stay advisory. Change this list, not individual posts.
#   FirstPerson, We: the author speaks as "I" and addresses readers as "we".
#   QuestionMarks:   posts may ask the reader questions, including the closing prompt.
#   Adverbs:         deliberate color in signed opinion pieces ("wisely", "seriously").
#   GeneralURL:      readers are technical, so "URL" is the right word.
[site/{blog,articles}/*.{md,mdx}]
BasedOnStyles = Vale, Microsoft
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.QuestionMarks = NO
Microsoft.Adverbs = NO
Microsoft.GeneralURL = NO
