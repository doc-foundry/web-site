StylesPath = styles
MinAlertLevel = suggestion
Vocab = DocFoundry

Packages = Microsoft

# MDX needs Vale's mdx2vast parser; add [*.mdx] when the blog is turned on.
[*.md]
BasedOnStyles = Vale, Microsoft

# Blog posts are first-person articles; product-doc rules on first person don't apply.
[site/blog/*.md]
BasedOnStyles = Vale, Microsoft
Microsoft.FirstPerson = NO
Microsoft.We = NO
