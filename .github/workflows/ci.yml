name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # onBrokenLinks: 'throw' in docusaurus.config.ts fails this step on broken internal links.
      - run: npm run build
      # Own-domain URLs (canonical, og:url) are internal links, already checked by the build.
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/site/build
            --exclude-path node_modules
            --exclude '^https?://(www\.)?doc-foundry\.com'
            './*.md' 'site/*.md' 'downloads/**/*.md' 'site/build/**/*.html'
          fail: true

  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@v2
        with:
          files: '["README.md", "site", "downloads", "notes"]'
          filter_mode: nofilter
          fail_on_error: true
